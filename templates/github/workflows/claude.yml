# เรียก @claude ในคอมเมนต์ของ issue หรือ PR
#
# ต้องมี secret ANTHROPIC_API_KEY (ตั้งระดับ org หรือ repo)
# อ่าน docs/06-claude-on-github.md ก่อนเปิดใช้ โดยเฉพาะหัวข้อความปลอดภัย
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # รันเฉพาะเมื่อมีคนพิมพ์ @claude จริง ๆ และไม่ใช่ bot
    if: |
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write        # ให้ push แก้ขึ้น branch ของ PR ได้
      pull-requests: write
      issues: write
      id-token: write
      actions: read          # ให้อ่านผล CI ของ PR ได้
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-opus-5
            --system-prompt "อ่าน CLAUDE.md ของ repo นี้ก่อนเสมอ และทำตามกติกาในนั้น ตอบเป็นภาษาไทย"
